services:
  api:
    build:
      context: ./backend/JsonDiffPlatform.Api
    ports:
      - "5297:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - json-diff-data:/app/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  json-diff-data:

